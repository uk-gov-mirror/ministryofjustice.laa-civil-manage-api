# Dev environment values for laa-civil-manage-api.
# Uses the laa-generic-helm-chart contract.
# See: https://github.com/ministryofjustice/laa-generic-helm-chart

environment: dev
appName: ""
nameOverride: "laa-civil-manage-api"
namespace: laa-civil-manage-api-dev
replicaCount: 1
serviceAccountName: cd-serviceaccount
createServiceAccount: false

image:
  registry: ""
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL

service:
  port: 8080

ingress:
  green:
    enabled: true
    className: modsec-non-prod
    hostname: laa-civil-manage-api-dev.cloud-platform.service.justice.gov.uk
    path: /
    pathType: Prefix
    annotations:
      external-dns.alpha.kubernetes.io/set-identifier: "laa-civil-manage-api-laa-civil-manage-api-dev-green"
      external-dns.alpha.kubernetes.io/aws-weight: "100"
      # Prevent NGINX from masking 5xx JSON responses (e.g., actuator/health) with default HTML pages.
      nginx.ingress.kubernetes.io/custom-http-errors: ""
      nginx.ingress.kubernetes.io/enable-modsecurity: "true"
      nginx.ingress.kubernetes.io/enable-owasp-core-rules: "true"
      nginx.ingress.kubernetes.io/modsecurity-transaction-id: "$request_id"
      nginx.ingress.kubernetes.io/modsecurity-snippet: |
        SecRuleEngine On
        SecDefaultAction "phase:2,pass,log,tag:github_team=laa-civil-manage-an-application"
        SecRule REQUEST_URI "!@beginsWith /actuator/health" "id:1001,phase:2,chain,deny,status:403,tag:github_team=laa-civil-manage-an-application"
        SecRule REMOTE_ADDR "!@ipMatch 35.176.93.186/32"
      # VPN IP ranges from: https://github.com/ministryofjustice/moj-ip-addresses/blob/main/moj-cidr-addresses.yml#L267 — /actuator/health* is exempt so Pingdom can reach it off-VPN.
  blue:
    enabled: false

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 60

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 60

autoscaling:
  enabled: false

# ---------------------------------------------------------------------------
# Container environment — all env vars and k8s secrets for the pod
# ---------------------------------------------------------------------------
containerEnvironment:
  enabled: true
  variables:
    SKIP_AUTH: "false"
    CORS_ALLOWED_ORIGINS: "https://laa-civil-manage-dev.cloud-platform.service.justice.gov.uk"
    AZURE_ENTRA_TENANT_ID: "8352c342-da15-413a-8b5b-d89545766f0c"
    AZURE_ENTRA_API_CLIENT_ID: "024c9bb4-b5fd-434b-abff-1d7d7c8776f4"
    AZURE_ENTRA_API_AUDIENCE: "efb49b90-5365-456f-bc87-c5a613e0d08d"
    ACCESS_DATA_STORE_OBO_SCOPE: "api://devlexternal.onmicrosoft.com/efb49b90-5365-456f-bc87-c5a613e0d08d/access_as_user"
    LEGAL_FRAMEWORK_API_BASE_URL: "https://main-legal-framework-uat.cloud-platform.service.justice.gov.uk"
    ACCESS_DATA_STORE_BASE_URL: "https://dev-token-enabled-internal-laa-data-access-api-uat.internal-non-prod.cloud-platform.service.justice.gov.uk"
    PROVIDER_DETAILS_API_BASE_URL: "https://laa-provider-details-api-uat.apps.live.cloud-platform.service.justice.gov.uk"
    GOV_UK_NOTIFY_EMAIL: "lucas.main@justice.gov.uk"
    GOV_UK_NOTIFY_TEMPLATE_ID: "7cdb67f0-09b8-459b-9d46-05f6edb57d3b"
  secrets:
    - name: AZURE_ENTRA_API_CLIENT_SECRET
      secretName: azure-entra-api-client-secret
      key: azure-entra-api-client-secret
    - name: GOV_UK_NOTIFY_API_KEY
      secretName: gov-uk-notify-api-key
      key: gov-uk-notify-api-key
    - name: PROVIDER_DETAILS_API_KEY
      secretName: provider-details-api-key
      key: provider-details-api-key

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}

